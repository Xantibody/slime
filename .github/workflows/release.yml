name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # PR と同じ検査を並列で通す。リリースは needs で後ろに置けば足りるので、
  # 検査そのものを直列に並べる理由はない
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # manifest.json のバージョンはタグから決まる。package.json 側を手で
      # 書き換え忘れたまま tag を打っても、配布物には正しい版が入る
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build extensions
        run: pnpm run build

      - name: Rename packages with version
        run: |
          mv dist/slite-ime-fix-chrome.zip "dist/slite-ime-fix-chrome-${GITHUB_REF_NAME}.zip"
          mv dist/slite-ime-fix-firefox.xpi "dist/slite-ime-fix-firefox-${GITHUB_REF_NAME}.xpi"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/slite-ime-fix-chrome-${{ github.ref_name }}.zip
            dist/slite-ime-fix-firefox-${{ github.ref_name }}.xpi
          generate_release_notes: true
