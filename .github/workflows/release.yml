name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # The same checks as a pull request, run in parallel. Putting the release
  # behind them with `needs` is enough; there is no reason to chain the checks
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The tag decides the version in manifest.json, so a tag pushed without
      # bumping package.json by hand still ships the right version
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build extensions
        run: pnpm run build

      - name: Rename packages with version
        run: |
          mv dist/slime-chrome.zip "dist/slime-chrome-${GITHUB_REF_NAME}.zip"
          mv dist/slime-firefox.xpi "dist/slime-firefox-${GITHUB_REF_NAME}.xpi"

      # AMO asks for the original source to review bundled code against
      - name: Package source
        run: pnpm run package:source

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/slime-chrome-${{ github.ref_name }}.zip
            dist/slime-firefox-${{ github.ref_name }}.xpi
          generate_release_notes: true

      # The stores get the same bytes as the GitHub Release. Rebuilding in each
      # publish job could make the Release and a store disagree
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/slime-*-${{ github.ref_name }}.*
          retention-days: 7

  publish-amo:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages

      - name: Publish to AMO
        uses: browser-actions/release-firefox-addon@v0.2.1
        with:
          addon-id: slime@example.com
          addon-path: slime-firefox-${{ github.ref_name }}.xpi
          source-path: slime-source-${{ github.ref_name }}.zip
          license: MIT
          release-note: "See https://github.com/Xantibody/slime/releases/tag/${{ github.ref_name }}"
          approval-note: "Build instructions are in SOURCE_BUILD.md inside the source archive."
          auth-api-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          auth-api-secret: ${{ secrets.AMO_JWT_SECRET }}

  publish-cws:
    needs: release
    runs-on: ubuntu-latest
    # CWS API v2 publish takes no version and submits whichever zip was
    # uploaded last. Two tags running at once could publish each other's zip
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages

      # The extension and publisher IDs are not secret, but they only exist
      # once the first submission is made in the dashboard, so they come from
      # repository variables instead of being written here
      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: slime-chrome-${{ github.ref_name }}.zip
          extension-id: ${{ vars.CWS_EXTENSION_ID }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
