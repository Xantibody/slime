name: Checks

# Pull requests and releases run the same checks, written once here and
# called from both. A check added to only one path slips through the other
on:
  workflow_call:

# Chained, everything waits behind the slowest step. As independent jobs, the
# wait is only as long as the slowest job
jobs:
  static:
    name: Format / Lint / Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run lint:comments
      - run: pnpm run typecheck
      # Unused exports, files and dependencies. oxlint sees one file at a time
      # and cannot catch them
      - run: pnpm run knip

  test:
    name: Test (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build

      # A broken package should not first show up at release time
      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            dist/slime-chrome.zip
            dist/slime-firefox.xpi
          retention-days: 7

# NOTE: pnpm e2e (agent-browser) is not here. It downloads a real browser,
# which is too heavy for every pull request, and the jsdom unit tests already
# pin down the duplicate-text reproduction. Run `pnpm e2e` locally, once
# before each release
