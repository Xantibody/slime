name: "Setup"
description: "Install the toolchain described in flake.nix, plus project dependencies"

runs:
  using: "composite"
  steps:
    - uses: DeterminateSystems/nix-installer-action@v16

    # The tool list lives in flake.nix's `toolchain`. Listing names again here
    # lets the two drift: a tool added to the devShell then fails in CI, or
    # the other way round
    - name: Install the toolchain
      shell: bash
      run: nix profile install .#toolchain

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
