<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Slime - reproduction fixture</title>
  </head>
  <body>
    <!--
      Reproduces the duplicate-text bug outside Slite.

      The markup is the block copied from a Slite page saved while the bug was
      showing (the page itself is not in the repository), and simulateIme()
      replays what Slate does around an IME commit: the composing text is typed
      into the mark placeholder, then on commit Slate inserts it as a real leaf
      but leaves its copy inside the placeholder.

      Open with ?fix=1 to load the built inject.js, ?fix=0 to see the raw bug.
    -->
    <div id="editor" contenteditable="true" data-slate-editor="true">
      <div class="slite-editor-block unstyled-block" data-type="unstyled">
        <span data-slate-node="text"
          ><span data-slate-leaf="true"><span data-slate-string="true">大変</span></span
          ><span data-slate-leaf="true"
            ><span
              id="placeholder"
              data-slate-zero-width="z"
              data-slate-length="0"
              data-slate-mark-placeholder="true"
              >&#xFEFF;</span
            ></span
          ></span
        >
      </div>
    </div>

    <script>
      const ZWNBSP = "﻿";
      const committed = document.querySelector("[data-slate-string]");
      const placeholder = document.getElementById("placeholder");

      // Stand-in for the Slate editor instance the extension reaches through
      // window.__EDITOR_REFS__.
      const editor = { marks: { bold: true } };
      window.__EDITOR_REFS__ = new Set([{ ref: { deref: () => editor } }]);

      function dispatchComposition(type, data) {
        placeholder.dispatchEvent(
          new CompositionEvent(type, { data, bubbles: true, cancelable: true }),
        );
      }

      // Replays one IME conversion: compose into the placeholder, commit the
      // text as a leaf, and leave Slate's stale copy behind.
      window.simulateIme = function simulateIme(text) {
        dispatchComposition("compositionstart", "");
        // Recorded so the test can prove the extension parked the marks.
        window.marksDuringComposition = editor.marks;
        placeholder.firstChild.data = ZWNBSP + text;
        dispatchComposition("compositionupdate", text);
        dispatchComposition("compositionend", text);
        committed.textContent += text;
        placeholder.firstChild.data = ZWNBSP + text;
      };

      // Slate/React re-rendering a frame later, which is what defeats a
      // one-shot cleanup on compositionend.
      window.simulateLateRerender = function simulateLateRerender(text) {
        return new Promise((resolve) => {
          setTimeout(() => {
            placeholder.firstChild.data = ZWNBSP + text;
            setTimeout(resolve, 50);
          }, 100);
        });
      };

      window.visibleText = function visibleText() {
        return document.getElementById("editor").textContent.replaceAll(ZWNBSP, "").trim();
      };

      window.editorMarks = function editorMarks() {
        return editor.marks;
      };

      if (new URLSearchParams(location.search).get("fix") === "1") {
        const script = document.createElement("script");
        script.src = "../dist/chrome/inject.js";
        document.head.append(script);
      }
    </script>
  </body>
</html>
