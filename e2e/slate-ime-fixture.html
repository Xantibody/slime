<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Slime - reproduction fixture</title>
  </head>
  <body>
    <!--
      Reproduces the duplicate-text bug outside Slite.

      The markup is the block copied from a Slite page saved while the bug was
      showing (the page itself is not in the repository), and simulateIme()
      replays what Slate does around an IME commit: the composing text is typed
      into the mark placeholder, then on commit Slate inserts it as a real leaf
      but leaves its copy inside the placeholder.

      Open with ?fix=1 to load the built page.js, ?fix=0 to see the raw bug.
    -->
    <div id="editor" contenteditable="true" data-slate-editor="true">
      <div class="slite-editor-block unstyled-block" data-type="unstyled">
        <span data-slate-node="text"
          ><span data-slate-leaf="true"><span data-slate-string="true">大変</span></span
          ><span data-slate-leaf="true"
            ><span
              id="placeholder"
              data-slate-zero-width="z"
              data-slate-length="0"
              data-slate-mark-placeholder="true"
              >&#xFEFF;</span
            ></span
          ></span
        >
      </div>
      <!--
        A database row title as Slite renders it: a plain input inside a
        non-editable block of the editor, whose Enter handler blurs it without
        checking for IME composition.
      -->
      <div id="row-title-cell" contenteditable="false">
        <input id="row-title" data-test-id="databaseNoteLinkTextInput" />
      </div>
    </div>

    <!--
      The search page's input: React renders it from the URL's `q`, which the
      page's store learns only in a layout effect, so each keystroke first
      writes the previous `q` back into the input, then the new one.
    -->
    <input id="search-input" data-test-id="search-input" />

    <script>
      const searchInput = document.getElementById("search-input");
      const inheritedValue = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
      // React DOM's value tracker, an own accessor on the input.
      Object.defineProperty(searchInput, "value", {
        configurable: true,
        get: () => inheritedValue.get.call(searchInput),
        set: (value) => inheritedValue.set.call(searchInput, value),
      });
      let searchQuery = "";
      searchInput.addEventListener("input", () => {
        const next = inheritedValue.get.call(searchInput);
        searchInput.value = searchQuery;
        // Recorded so the test can see what the IME was left with.
        window.searchValueAfterStaleWrite = inheritedValue.get.call(searchInput);
        searchQuery = next;
        searchInput.value = searchQuery;
      });

      // Replays one keystroke of a conversion: the browser puts the composing
      // text into the input without the page's setter, then fires `input`.
      window.simulateSearchKeystroke = function simulateSearchKeystroke(text) {
        searchInput.dispatchEvent(new CompositionEvent("compositionstart", { bubbles: true }));
        inheritedValue.set.call(searchInput, text);
        searchInput.dispatchEvent(new InputEvent("input", { bubbles: true, isComposing: true }));
        const afterStaleWrite = window.searchValueAfterStaleWrite;
        searchInput.dispatchEvent(new CompositionEvent("compositionend", { bubbles: true }));
        return afterStaleWrite;
      };
    </script>

    <script>
      document.getElementById("row-title-cell").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.target.blur();
        }
      });

      const ZWNBSP = "﻿";
      const committed = document.querySelector("[data-slate-string]");
      const placeholder = document.getElementById("placeholder");

      // Stand-in for the Slate editor instance the extension reaches through
      // window.__EDITOR_REFS__.
      const editor = { marks: { bold: true } };
      window.__EDITOR_REFS__ = new Set([{ ref: { deref: () => editor } }]);

      function dispatchComposition(type, data) {
        placeholder.dispatchEvent(
          new CompositionEvent(type, { data, bubbles: true, cancelable: true }),
        );
      }

      // Replays one IME conversion: compose into the placeholder, commit the
      // text as a leaf, and leave Slate's stale copy behind.
      window.simulateIme = function simulateIme(text) {
        dispatchComposition("compositionstart", "");
        // Recorded so the test can prove the extension parked the marks.
        window.marksDuringComposition = editor.marks;
        placeholder.firstChild.data = ZWNBSP + text;
        dispatchComposition("compositionupdate", text);
        dispatchComposition("compositionend", text);
        committed.textContent += text;
        placeholder.firstChild.data = ZWNBSP + text;
      };

      // Slate/React re-rendering a frame later, which is what defeats a
      // one-shot cleanup on compositionend.
      window.simulateLateRerender = function simulateLateRerender(text) {
        return new Promise((resolve) => {
          setTimeout(() => {
            placeholder.firstChild.data = ZWNBSP + text;
            setTimeout(resolve, 50);
          }, 100);
        });
      };

      window.visibleText = function visibleText() {
        return document.getElementById("editor").textContent.replaceAll(ZWNBSP, "").trim();
      };

      window.editorMarks = function editorMarks() {
        return editor.marks;
      };

      if (new URLSearchParams(location.search).get("fix") === "1") {
        const script = document.createElement("script");
        script.src = "../dist/chrome/page.js";
        document.head.append(script);
      }
    </script>
  </body>
</html>
