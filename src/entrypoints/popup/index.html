<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #656d76;
        --line: #d8dee4;
        --track: #c4cbd3;
        --accent: #2f9e6f;
        --paused: #b35900;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c2128;
          --fg: #e6edf3;
          --muted: #9198a1;
          --line: #373e47;
          --track: #545d68;
          --accent: #3fb27f;
          --paused: #f0883e;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px 12px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.5 system-ui,
          -apple-system,
          "Hiragino Sans",
          "Yu Gothic UI",
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header img {
        width: 32px;
        height: 32px;
        border-radius: 7px;
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }
      #version {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .description {
        margin: 8px 0 12px;
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .row .label {
        display: flex;
        flex-direction: column;
      }
      .row .hint {
        color: var(--muted);
        font-size: 12px;
      }
      #status {
        color: var(--accent);
        font-size: 12px;
      }
      body.paused #status {
        color: var(--paused);
      }
      body.paused .extra {
        opacity: 0.5;
      }
      h2 {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .switch {
        position: relative;
        flex: none;
        width: 36px;
        height: 20px;
      }
      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--track);
        transition: background 0.15s;
        pointer-events: none;
      }
      .switch span::before {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        content: "";
        transition: transform 0.15s;
      }
      .switch input:checked + span {
        background: var(--accent);
      }
      .switch input:checked + span::before {
        transform: translateX(16px);
      }
      .switch input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      footer {
        display: flex;
        gap: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      footer a {
        color: var(--muted);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--fg);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <h1>Slime</h1>
      <span id="version"></span>
    </header>
    <p class="description">
      Slite で日本語を入力したときに、文字が二重に表示・保存されるのを防ぎます。
    </p>

    <div class="row">
      <label class="label" for="enabledToggle">
        <span>Slime を有効にする</span>
        <span id="status"></span>
      </label>
      <span class="switch">
        <input type="checkbox" id="enabledToggle" />
        <span></span>
      </span>
    </div>

    <h2>おまけ</h2>
    <div class="row extra">
      <label class="label" for="emacsToggle">
        <span>Emacs キーバインド</span>
        <span class="hint">Ctrl+F / B / N / P / A / E でカーソル移動</span>
      </label>
      <span class="switch">
        <input type="checkbox" id="emacsToggle" />
        <span></span>
      </span>
    </div>

    <footer>
      <a href="https://github.com/Xantibody/slime" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/Xantibody/slime/issues/new" target="_blank" rel="noopener"
        >不具合を報告</a
      >
      <a href="https://github.com/Xantibody/slime/releases" target="_blank" rel="noopener"
        >更新履歴</a
      >
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
