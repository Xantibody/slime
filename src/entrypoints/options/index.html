<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Slime - その他の設定</title>
    <style>
      :root {
        --bg: #f6f8fa;
        --card: #ffffff;
        --fg: #1f2328;
        --muted: #656d76;
        --line: #d8dee4;
        --track: #c4cbd3;
        --accent: #2f9e6f;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15191e;
          --card: #1c2128;
          --fg: #e6edf3;
          --muted: #9198a1;
          --line: #373e47;
          --track: #545d68;
          --accent: #3fb27f;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.6 system-ui,
          -apple-system,
          "Hiragino Sans",
          "Yu Gothic UI",
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      header img {
        width: 40px;
        height: 40px;
        border-radius: 9px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }
      .card {
        padding: 4px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 0;
      }
      .label {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .label strong {
        font-size: 15px;
        font-weight: 600;
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
      }
      .note {
        margin: 12px 4px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .switch {
        position: relative;
        flex: none;
        width: 40px;
        height: 22px;
      }
      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--track);
        transition: background 0.15s;
        pointer-events: none;
      }
      .switch span::before {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        content: "";
        transition: transform 0.15s;
      }
      .switch input:checked + span {
        background: var(--accent);
      }
      .switch input:checked + span::before {
        transform: translateX(18px);
      }
      .switch input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" alt="" />
        <h1>その他の設定</h1>
      </header>

      <div class="card">
        <div class="row">
          <label class="label" for="emacsToggle">
            <strong>Emacs キーバインド</strong>
            <span class="hint"
              >Ctrl+F / B / N / P / A / E で、Slite の中のカーソルを動かします</span
            >
          </label>
          <span class="switch">
            <input type="checkbox" id="emacsToggle" />
            <span></span>
          </span>
        </div>
      </div>
      <p class="note">
        Windows と Linux では、Ctrl+N はブラウザの新しいウィンドウに使われるため効きません。
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
