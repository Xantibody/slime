# Lints source comments (Vale extracts them with tree-sitter; string literals
# are never seen). `ts = md` makes backticked spans read as code, so an
# identifier, a path or Japanese sample text inside backticks is skipped.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[formats]
ts = md
js = md

[*.{ts,js}]
BasedOnStyles = Slime, proselint
# Flags NOTE/TODO/FIXME as leftovers; AIDEV-NOTE and HACK(...) are the house
# anchors, so the rule would fire on every one
proselint.Annotations = NO

# Vale cannot pull comments out of Nix or JSONC (only a parser for some other
# language happens to, which would break on the next unfamiliar syntax), so
# these are read as plain text and Japanese is banned from the whole file.
# Nothing is lost: the Japanese that reproduces the IME bug lives in the tests,
# never in configuration. proselint stays off, since it would read the code too
[*.{nix,yml,yaml,json,jsonc,toml}]
BasedOnStyles = Slime
